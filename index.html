<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>make-your-game</title>
  <link rel="shortcut icon" type="image/x-icon" href="data:image/x-icon;,">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="./make-your-game.css">
</head>

<body>
  <div id="fps-display"></div>
  <!-- SVG container for the game -->

  <!-- <svg id="svg-container" width="100%" height="100%" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">-->
  <svg id="svg-container" width="800" height="600">
    <!-- Game objects will be added here -->
     <g id="targetsLayer">
     </g>
     <g id="playerLayer"></g>
     <g id="ui"></g>
  </svg>

  <svg id="hidden-template" style="display: none;">
    <!-- This is a hidden template, you can define any SVG elements here -->
    <circle id="template-circle" cx="0" cy="0" r="20" fill="red" />
    <text id="template-text" text-anchor="middle" x="0" y="0" font-family="Roboto Mono, monospace" font-size="30" fill="white" text-anchor="middle">A</text>
  </svg>
  
  <!-- External JavaScript -->
  <script type="module" src="main.js"></script>

  <!-- Inline or optional: Init function might be inside the script -->
  <script type="module">
    import { main } from './main.js';
    main();
  </script>
</body>

</html>
